# DirectGNN configuration with tuned proxy hyperparameters
# from the 20-trial scaffold proxy search (best val MAE 2.3193).

model:
  hidden_dim: 128
  n_gnn_layers: 4
  encoder_role_mode: "shared_residual"
  encoder_role_specific_layers: 2
  n_cross_attn_layers: 3
  pair_dim: 512
  interaction_mode: "cross_attn"
  dropout: 0.17410772492930618
  use_solvent_moe: true
  use_temperature_in_encoder: false
  use_temperature_in_interaction: false
  use_temperature_in_nrtl_head: true

training:
  epochs_phase2: 200
  batch_size: 64
  use_pair_temperature_batching: true
  pair_temperature_min_group_size: 2
  pair_temperature_group_chunk_size: 4
  use_source_uncertainty_weights: true
  source_uncertainty_csv: "results/source_uncertainty_audit_reviewed/supervised_rows_with_source_uncertainty.csv"
  source_uncertainty_weight_mode: "inverse_variance"
  source_uncertainty_default_sigma_ln_x2: 0.75
  source_uncertainty_min_sigma_ln_x2: 0.20
  source_uncertainty_min_weight: 0.25
  source_uncertainty_max_weight: 4.0
  lr_phase2: 0.0008555952685634822
  direct_weight_decay: 4.178742338819323e-05
  patience: 30
  grad_clip: 2.544212750214583
