# Physics-grounded analytic decomposition (paper: conditional optimality of physics).
#
# ln x2 = -Phi(T; T_m, dH_fus) - ln gamma2,  with:
#   * crystal head grounded on Joback GC priors (use_gc_priors_crystal) so Phi(T)
#     is anchored to a per-molecule physical prior usable for any SMILES;
#   * analytic gamma_inf activity (affine in 1/T) -> closed van't Hoff curve;
#   * stop-grad of Phi into the activity residual (detach_crystal_params_in_sle);
#   * coordinate-descent so the crystal branch (phase 1/3) and activity branch
#     (phase 2) get independent training signal.
#
# The headline experiment (E2) trains this config WITHOUT vs WITH the external
# single-component crystal aux stream:
#   WITHOUT: scripts/train.py --config configs/physics_grounded.yaml ...
#   WITH:    scripts/train.py --config configs/physics_grounded.yaml \
#               --crystal-train-data <crystal_aux.csv> --crystal-steps-per-epoch 8 ...
# UNIFAC activity prior is OFF here; it is an E4 ablation lever, not part of the
# load-bearing config (avoids a fragile thermo/DDBST runtime dependency).

model:
  hidden_dim: 256
  n_gnn_layers: 6
  encoder_role_mode: "shared_residual"
  encoder_role_specific_layers: 2
  n_cross_attn_layers: 3
  pair_dim: 512
  interaction_mode: "cross_attn"
  activity_model: "nrtl"
  nrtl_tau_mode: "gamma_inf"
  use_implicit_diff: true
  use_solvent_moe: true
  use_temperature_in_encoder: false
  use_temperature_in_interaction: false
  use_temperature_in_nrtl_head: true
  S_gamma_inf_ref: 5.0
  S_gamma_inf_inv: 5.0
  # --- crystal grounding ---
  use_gc_priors_crystal: true
  predict_dCp_fus: false            # required when GC crystal priors are on
  fixed_dCp_fus: 0.0
  gc_prior_residual_freeze_epochs: 5
  fusion_output_mode: "direct"
  fusion_enthalpy_init: 20000.0
  # --- decomposition / branch control ---
  branch_training_mode: "coordinate_descent"
  detach_crystal_from_encoder: true
  detach_crystal_params_in_sle: true
  use_unifac_gamma_prior: false
  # --- solver ---
  set2set_steps: 3
  n_iter_train: 5
  n_iter_eval: 20
  damping: 0.7
  solver_min_damping: 0.1
  solver_tol_train: 1.0e-5
  solver_tol_eval: 1.0e-7
  solver_adaptive_damping: true
  correction_max_abs: 2.0
  correction_Tm_max_delta: 60.0
  correction_dH_fraction: 0.25
  correction_tau_max_delta: 2.0

training:
  epochs_phase1: 50
  epochs_phase2: 200
  epochs_phase3: 50
  phase2_correction_unfreeze_epoch: 20
  batch_size: 64
  use_pair_temperature_batching: true
  pair_temperature_min_group_size: 2
  pair_temperature_group_chunk_size: 4
  lr_phase1: 3.0e-4
  lr_phase2: 1.0e-4
  lr_phase3: 1.0e-5
  warmup_epochs: 5
  patience: 20
  grad_clip: 1.0
  vant_hoff_slope_scale: 5000.0
  vant_hoff_intercept_scale: 10.0
  vant_hoff_fit_r2_min: 0.95
  sol_loss_type: "huber"
  # External crystal aux stream is supplied via CLI for the WITH run; 0 here so
  # the WITHOUT run is the config default.
  crystal_aux_steps_per_epoch: 0

loss_weights:
  phase1:
    sol: 0.0
    T_m: 1.0
    dH: 1.0
    hansen: 0.5
    gamma_inf: 0.5
  phase2:
    sol: 1.0
    T_m: 0.05
    dH: 0.05
    hansen: 0.05
    gamma_inf: 0.1
    res: 0.01
    phys_pref: 0.01
    direct_reg: 0.01
    direct_nll: 0.01
    pair_temp_rank: 0.005
    vant_hoff_local: 0.001
  phase3:
    sol: 1.0
    T_m: 0.03
    dH: 0.03
    hansen: 0.03
    gamma_inf: 0.05
    mono: 0.1
    res: 0.02
    phys_pref: 0.01
    direct_reg: 0.02
    direct_nll: 0.02
    pair_temp_rank: 0.01
    vant_hoff_local: 0.001
