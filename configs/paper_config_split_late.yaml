# TGNN-Solv configuration for the split-late encoder comparison.
# This mirrors the paper config while switching the encoder to the
# asymmetric late-branch variant for an apples-to-apples backbone study.

model:
  hidden_dim: 256
  n_gnn_layers: 6
  encoder_role_mode: "split_late"
  encoder_role_specific_layers: 2
  n_cross_attn_layers: 3

  pair_dim: 512
  interaction_mode: "cross_attn"

  use_implicit_diff: true
  use_solvent_moe: true
  nrtl_tau_mode: "ref_invT"
  use_temperature_in_encoder: false
  use_temperature_in_interaction: false
  use_temperature_in_nrtl_head: true

  set2set_steps: 3
  n_iter_train: 5
  n_iter_eval: 20
  damping: 0.7
  solver_min_damping: 0.1
  solver_tol_train: 1.0e-5
  solver_tol_eval: 1.0e-7
  solver_adaptive_damping: true
  correction_max_abs: 2.0
  correction_Tm_max_delta: 60.0
  correction_dH_fraction: 0.25
  correction_tau_max_delta: 2.0
  monotonicity_force_explicit: false

training:
  epochs_phase1: 50
  epochs_phase2: 200
  epochs_phase3: 50

  batch_size: 64
  use_pair_temperature_batching: true
  pair_temperature_min_group_size: 2
  pair_temperature_group_chunk_size: 4
  lr_phase1: 3.0e-4
  lr_phase2: 1.0e-4
  lr_phase3: 1.0e-6
  warmup_epochs: 5
  patience: 30
  grad_clip: 1.0

data:
  split_mode: "solute_scaffold"
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1
  aux_only_fraction: 0.3

loss_weights:
  phase1:
    sol: 0.0
    T_m: 1.0
    dH: 1.0
    hansen: 0.5
    gamma_inf: 0.5
    mono: 0.0
    res: 0.0
    bridge: 0.0

  phase2:
    sol: 1.0
    T_m: 0.3
    dH: 0.3
    hansen: 0.2
    gamma_inf: 0.5
    mono: 0.05
    res: 0.03
    bridge: 0.05
    phys_pref: 0.05
    direct_reg: 0.05
    direct_nll: 0.05
    pair_temp_rank: 0.02
    vant_hoff_local: 0.01

  phase3:
    sol: 1.0
    T_m: 0.2
    dH: 0.2
    hansen: 0.1
    gamma_inf: 0.3
    mono: 0.3
    res: 0.05
    bridge: 0.1
    phys_pref: 0.03
    direct_reg: 0.05
    direct_nll: 0.05
    pair_temp_rank: 0.05
    vant_hoff_local: 0.03
