# Tiny crystal-known probe for direct-activity TGNN-Solv.

model:
  hidden_dim: 64
  n_gnn_layers: 2
  encoder_role_mode: "shared_residual"
  encoder_role_specific_layers: 1
  n_cross_attn_layers: 1
  pair_dim: 128
  interaction_mode: "cross_attn"
  activity_model: "nrtl"
  use_implicit_diff: true
  use_solvent_moe: true
  nrtl_tau_mode: "gamma_inf"
  use_temperature_in_encoder: false
  use_temperature_in_interaction: false
  use_temperature_in_nrtl_head: true
  S_gamma_inf_ref: 5.0
  S_gamma_inf_inv: 5.0
  use_activity_global_bias: true
  activity_global_bias_init: 0.0
  predict_dCp_fus: false
  fixed_dCp_fus: 0.0
  use_direct_phi_branch: true
  direct_phi_for_missing_tm: true
  direct_phi_for_decomposition: true
  direct_phi_intercept_scale: 20.0
  direct_phi_slope_scale: 5000.0
  direct_phi_slope_init: 2500.0
  fusion_output_mode: "entropy_coupled"
  fusion_entropy_min: 20.0
  fusion_entropy_max: 150.0
  fusion_entropy_init: 56.5
  fusion_enthalpy_init: 20000.0
  use_ionic_features: true
  ionic_feature_hidden_dim: 32
  use_aux_direct_sol_loss: true
  aux_direct_sol_loss_weight: 0.5
  aux_direct_sol_loss_phase3_weight: 0.01
  detach_crystal_from_encoder: true
  detach_crystal_params_in_sle: true
  set2set_steps: 3
  n_iter_train: 5
  n_iter_eval: 20
  damping: 0.7
  solver_min_damping: 0.1
  solver_tol_train: 1.0e-5
  solver_tol_eval: 1.0e-7
  solver_adaptive_damping: true
  correction_max_abs: 2.0
  correction_Tm_max_delta: 60.0
  correction_dH_fraction: 0.25
  correction_tau_max_delta: 2.0

training:
  epochs_phase1: 5
  epochs_phase2: 20
  epochs_phase3: 5
  phase2_correction_unfreeze_epoch: 1
  batch_size: 8
  use_pair_temperature_batching: false
  lr_phase1: 3.0e-4
  lr_phase2: 1.0e-4
  lr_phase3: 1.0e-5
  warmup_epochs: 0
  patience: 10
  grad_clip: 1.0
  sol_loss_type: "weighted_mae"
  sol_bin_weight_mode: "fixed"
  sol_bin_edges: [-25.0, -15.0, -12.0, -9.0, -6.0, -3.0, 0.0]
  sol_bin_weights: [3.0, 2.0, 1.2, 1.0, 1.5, 2.5]
  sol_bin_weight_min: 0.25
  sol_bin_weight_max: 8.0
  sol_variance_loss_weight: 0.05

loss_weights:
  phase1:
    sol: 0.0
    T_m: 1.0
    dH: 1.0
    hansen: 0.5
    gamma_inf: 0.5
    mono: 0.0
    res: 0.0
    bridge: 0.0
    aux_direct_sol: 0.0
    pair_temp_delta: 0.0
    vant_hoff_slope: 0.0
    vant_hoff_intercept: 0.0
    sol_variance: 0.0
  phase2:
    sol: 1.0
    T_m: 0.05
    dH: 0.05
    hansen: 0.05
    gamma_inf: 0.1
    mono: 0.0
    res: 0.01
    bridge: 0.0
    phys_pref: 0.01
    direct_reg: 0.01
    direct_nll: 0.01
    pair_temp_rank: 0.0
    vant_hoff_local: 0.0
    pair_temp_delta: 0.0
    vant_hoff_slope: 0.0
    vant_hoff_intercept: 0.0
    aux_direct_sol: 0.5
    sol_variance: 0.05
  phase3:
    sol: 1.0
    T_m: 0.03
    dH: 0.03
    hansen: 0.03
    gamma_inf: 0.05
    mono: 0.1
    res: 0.02
    bridge: 0.0
    phys_pref: 0.01
    direct_reg: 0.02
    direct_nll: 0.02
    pair_temp_rank: 0.0
    vant_hoff_local: 0.0
    pair_temp_delta: 0.0
    vant_hoff_slope: 0.0
    vant_hoff_intercept: 0.0
    aux_direct_sol: 0.05
    sol_variance: 0.05
