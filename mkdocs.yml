site_name: TGNN-Solv Documentation
site_description: Physics-informed Graph Neural Network for Solubility Prediction
site_author: doctawho42
site_url: https://doctawho42.github.io/tgnn-solv/
repo_url: https://github.com/doctawho42/tgnn-solv
repo_name: doctawho42/tgnn-solv

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
  palette:
    - scheme: slate
      primary: blue
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: blue
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.expand
    - content.code.copy
    - search.suggest
    - search.highlight
    - content.tabs.link

plugins:
  - search

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - pymdownx.highlight:
      use_pygments: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:pymdownx.emoji.twemoji
      emoji_generator: !!python/name:pymdownx.emoji.to_svg
  - admonition
  - toc:
      permalink: true

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - assets/stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/doctawho42/tgnn-solv

nav:
  - Home: index.md
  - Start Here:
    - Installation: getting_started/installation.md
    - Quick Start Workflow: getting_started/quick_start.md
    - Notebooks & Tutorials: notebooks.md
  - Guides:
    - Architecture: architecture.md
    - Data Preparation: data_preparation.md
    - Training: training.md
    - Evaluation & Inference: evaluation.md
    - Baselines: baselines.md
    - Config Cookbook: config_cookbook.md
  - Workflows:
    - Results: results.md
    - Experiments & Benchmarks: experiments.md
    - Model Zoo: model_zoo.md
    - Reproducing the Paper: reproducing_paper.md
    - Free GPU / Preemptible Training: free_gpu_training.md
  - Reference:
    - Script Reference: script_reference.md
    - FAQ: faq.md
    - Troubleshooting: troubleshooting.md
    - Repository Audit: repository_audit.md
  - Project:
    - Contributing: contributing.md
