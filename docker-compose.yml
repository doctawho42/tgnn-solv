services:
  lab:
    build:
      context: .
      args:
        TGNN_EXTRAS: gui,dev
    ports:
      - "8501:8501"
    working_dir: /app
    volumes:
      - .:/app
    environment:
      TGNN_SOLV_LAB_PYTHON: /opt/venv/bin/python
    command:
      - scripts/launch_lab.py
      - --server.address
      - 0.0.0.0
      - --server.port
      - "8501"

  docs:
    build:
      context: .
      args:
        TGNN_EXTRAS: gui,dev
    ports:
      - "8000:8000"
    working_dir: /app
    volumes:
      - .:/app
    command:
      - -m
      - mkdocs
      - serve
      - -a
      - 0.0.0.0:8000

  train:
    build:
      context: .
      args:
        TGNN_EXTRAS: dev
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    working_dir: /app
    volumes:
      - .:/app
    command:
      - scripts/training/train.py
      - --config
      - configs/paper_config_tuned.yaml
      - --train-data
      - notebooks/data/processed/train.csv
      - --val-data
      - notebooks/data/processed/val.csv
      - --test-data
      - notebooks/data/processed/test.csv
      - --checkpoint
      - checkpoints/model.pt
      - --device
      - cuda

  evaluate:
    build:
      context: .
      args:
        TGNN_EXTRAS: dev
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    working_dir: /app
    volumes:
      - .:/app
    command:
      - scripts/evaluation/evaluate_complete.py
      - --test-data
      - notebooks/data/processed/test.csv
      - --tgnn-checkpoint
      - checkpoints/model.pt
      - --output
      - results/evaluation.json

  external-benchmarks:
    build:
      context: .
      args:
        TGNN_EXTRAS: gui,dev
        INSTALL_BASELINES: 1
    working_dir: /app
    volumes:
      - .:/app
    command:
      - scripts/experiments/run_external_baseline_benchmark.py
      - --train-data
      - notebooks/data/processed/train.csv
      - --val-data
      - notebooks/data/processed/val.csv
      - --test-data
      - notebooks/data/processed/test.csv
      - --out-dir
      - results/external_baselines/docker_run
      - --split-mode
      - solute_scaffold
      - --fastsolv-mode
      - both
      - --solprop-mode
      - native
